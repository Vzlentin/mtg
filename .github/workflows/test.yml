name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Python 3.9 builds exist only up to Ubuntu 24.04.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python tests/test_mtg.py

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: pipx run ruff==0.16.9 check bin/mtg tests
      - run: pipx run ruff==0.16.9 format --check bin/mtg tests
      - run: shellcheck install.sh
